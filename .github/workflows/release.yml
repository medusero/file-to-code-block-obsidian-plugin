name: Release

on:
    push:
        tags:
            - "*"
permissions:
    contents: write
    id-token: write
    attestations: write
jobs:
    release:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Check tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version=$(jq -r .version manifest.json)
                  if [ "$tag" != "$version" ]; then
                    echo "Tag $tag does not match manifest version $version"
                    exit 1
                  fi
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - name: Install dependencies
              run: npm ci
            - name: Type check
              run: npx tsc --noEmit
            - name: Test
              run: npm test
            - name: Build
              run: npm run build
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                    main.js
                    styles.css
            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" main.js manifest.json styles.css --title "$tag" --draft --generate-notes
